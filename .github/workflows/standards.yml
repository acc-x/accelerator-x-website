name: Standards

# Enforces .claude/rules/standards.md on every PR into main and push to main.
# Two jobs, both required:
#   build   — npm run build must exit 0 AND leave the tree clean (committed
#             artefacts must be byte-identical to a fresh build — the structural
#             property the "pre-built artefacts committed" deploy model rests on)
#   check   — npm run check + npm test must exit 0 (standards violations + money-path
#             unit test regressions both block)
#
# These run in parallel. Either failure blocks the push from being considered clean.
# The doc-freshness.yml workflow enforces CHANGELOG + ROADMAP update requirements.
# Dependency auditing lives in dependency-audit.yml (#107): an advisory published
# against the world is not a property of the change under review, so it no longer
# sits on the merge gate.
#
# pull_request added 2026-08-09 (#100). Both jobs are REQUIRED status checks on
# main, but with only a push trigger they never reported on a PR — so a PR into
# main could not satisfy them and sat permanently BLOCKED. The 'rebuild/**' push
# trigger was removed 2026-08-21: the branch was retired in the org move and the
# dead trigger misdescribed the working model.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Build passes
    runs-on: ubuntu-latest
    steps:
      # Full history: sitemap <lastmod> resolves from each page's last commit date
      # (scripts/build-hub.js resolveLastmod) — a shallow clone would rebuild the
      # sitemap with wrong dates and break the committed==buildable property here.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Confirm build artefacts generated
        run: |
          # Spot-check that key artefacts were produced
          test -f insights/index.html          || (echo "❌ insights/index.html missing" && exit 1)
          test -f assets/css/tailwind.generated.css || (echo "❌ tailwind.generated.css missing" && exit 1)
          echo "✅ Build artefacts present"

      - name: Committed artefacts match a fresh build
        # The deploy model serves the repo as-is with no Netlify build, so a PR
        # that edits templates/scripts without committing the rebuilt output would
        # otherwise ship stale pages silently. Requires the fetch-depth: 0 checkout
        # above — a shallow clone rebuilds the sitemap with wrong <lastmod> dates
        # and would false-positive this diff.
        #
        # <lastmod> lines are excluded from the diff (-I): sitemap dates derive
        # from each page's last COMMITTER date (build-hub.js resolveLastmod), and
        # this repo squash-merges — a squash re-dates every touched page to merge
        # day, so a next-day merge would make this required check go red on main
        # and on every subsequent PR until someone hand-committed a rebuilt
        # sitemap. That is world-state gating unrelated changes, the exact
        # failure class #107 removed from this job. Structural sitemap drift
        # (URLs added/removed) still fails; only date drift is tolerated.
        # Untracked output is checked separately — `git diff` alone would pass a
        # brand-new built page that was never committed.
        run: |
          git diff -I '<lastmod>' --exit-code || (echo "❌ Committed artefacts are stale — run 'npm run build' and commit the result" && exit 1)
          UNTRACKED=$(git ls-files --others --exclude-standard)
          if [ -n "$UNTRACKED" ]; then
            echo "❌ Fresh build produced files that are not committed:"
            echo "$UNTRACKED"
            exit 1
          fi
          echo "✅ Committed artefacts match a fresh build (lastmod-tolerant)"

  check:
    name: Standards check passes
    runs-on: ubuntu-latest
    steps:
      # Full history for the same reason as the build job: this job runs
      # npm run build, and scripts/build-hub.js resolves sitemap <lastmod>
      # from per-file git history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (required for token substitution check)
        run: npm run build

      - name: Run standards check
        run: npm run check

      - name: Run unit tests
        run: npm test
